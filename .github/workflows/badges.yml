# Counts lines in the script and template, then publishes loc.svg on the
# orphan branch `badges`. The README image points at that branch.

name: Lines of Code

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: true

jobs:
  loc:
    name: Publish badge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Count lines
        id: badge
        uses: shadowmoose/GHA-LoC-Badge@1.0.0
        with:
          directory: ./
          badge: ./output/loc.svg
          patterns: "*.ps1|*.bat"
          badge_label: lines of code
          badge_color: blue
          badge_style: flat

      - name: Require counted files
        shell: bash
        run: |
          set -euo pipefail
          echo "Counted ${{ steps.badge.outputs.counted_files }} files, ${{ steps.badge.outputs.total_lines }} lines."
          if [ "${{ steps.badge.outputs.counted_files }}" = "0" ]; then
            echo "The lines-of-code scan matched no files."
            exit 1
          fi

      - name: Publish badges branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: badges
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Update lines-of-code badge
